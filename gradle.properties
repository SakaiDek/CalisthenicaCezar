# --- Memori: Advan RAM 8GB, jadi kita kunci plafon tiap daemon ---
# Gradle daemon: 2 GB cukup untuk project sekecil ini.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Kotlin punya daemon SENDIRI (JVM terpisah). Kalau tidak dibatasi, dia bisa
# minta default besar dan laptop mulai swap ke NVMe -> build terasa berat.
kotlin.daemon.jvmargs=-Xmx1024m

# --- Kecepatan build ---
org.gradle.parallel=true
org.gradle.caching=true

# --- Android / Kotlin ---
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# --- Windows: kurangi peluang file terkunci (ditambah 5 Sept 2026) ---
# Sejak Gradle 7, Gradle "mengintip" folder proyek terus-menerus supaya tahu
# file mana yang berubah tanpa harus memeriksa satu-satu. Cepat di Linux,
# tapi di Windows caranya adalah MEMEGANG handle ke direktori   dan handle
# yang dipegang itulah yang bisa berubah jadi:
#   "The process cannot access the file because it is being used by
#    another process"
# Persis error yang mematikan build 5 Sept 2026 di :app:processDebugResources.
# Ongkos mematikannya: pemeriksaan "sudah up-to-date belum" jadi sedikit
# lebih lambat. Untuk proyek 19 file, selisihnya tidak akan kamu rasakan.
# Kalau suatu saat mau dicoba nyala lagi, cukup ubah jadi true.
org.gradle.vfs.watch=false